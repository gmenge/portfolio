<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem Enviada | Gabriel Menge</title>
    
    <!-- CSS do Projeto -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Ícones (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .thank-you-container {
            text-align: center;
            padding: 60px 20px;
        }

        .thank-you-icon {
            font-size: 4em;
            color: #57b846;
            margin-bottom: 20px;
        }

        .thank-you-title {
            font-size: 2em;
            color: #222;
            margin-bottom: 15px;
        }

        .thank-you-text {
            font-size: 1.1em;
            color: #555;
            max-width: 600px;
            margin: 0 auto 30px auto;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #57b846;
            color: #fff;
            text-decoration: none;
            padding: 14px 28px;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.3s ease, transform 0.2s;
        }

        .btn-home:hover {
            background: #45a035;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Gabriel Menge</h1>
            <p>Analista de Sistemas</p>
        </div>
    </header>

    <main>
        <section class="thank-you-container">
            <i class="fa-solid fa-circle-check thank-you-icon"></i>
            <h2 class="thank-you-title">Mensagem Enviada com Sucesso!</h2>
            <p class="thank-you-text">
                Obrigado pelo contato. Recebi suas informações e retornarei o seu e-mail o mais breve possível.
            </p>
            <a href="index.html" class="btn-home">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Site
            </a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Gabriel Menge. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
